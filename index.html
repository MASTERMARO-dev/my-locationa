<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Location</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    text-align: center;
    padding: 20px;
    margin: 0;
  }
  button {
    padding: 12px 20px;
    font-size: 17px;
    border-radius: 10px;
    border: 0;
    background: #007aff;
    color: white;
  }
  #status {
    white-space: pre-line;
    margin: 20px 0;
  }
  #map {
    width: 100%;
    height: 450px;
    border: 0;
    border-radius: 12px;
    display: none;
  }
</style>
</head>
<body>
<h2>My Location</h2>
<button onclick="getLocation()">Find My Location</button>
<p id="status">Press the button to request your location.</p>
<iframe id="map" loading="lazy"></iframe>

<script>
function getLocation() {
  const status = document.getElementById("status");
  const map = document.getElementById("map");

  if (!navigator.geolocation) {
    status.textContent = "Geolocation is not supported by this WebView.";
    return;
  }

  status.textContent = "Requesting your location...";

  navigator.geolocation.getCurrentPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const accuracy = Math.round(position.coords.accuracy);

      status.textContent =
        "Latitude: " + lat +
        "\nLongitude: " + lon +
        "\nAccuracy: about " + accuracy + " meters";

      const delta = 0.01;

      map.src =
        "https://www.openstreetmap.org/export/embed.html?bbox=" +
        (lon - delta) + "%2C" +
        (lat - delta) + "%2C" +
        (lon + delta) + "%2C" +
        (lat + delta) +
        "&layer=mapnik&marker=" +
        lat + "%2C" + lon;

      map.style.display = "block";
    },
    function(error) {
      let message = "Unable to get your location.";

      if (error.code === 1) {
        message = "Location permission was denied. Allow location access for the app/WebView.";
      } else if (error.code === 2) {
        message = "Your location is currently unavailable.";
      } else if (error.code === 3) {
        message = "Location request timed out. Try again.";
      }

      status.textContent = message;
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}
</script>
</body>
</html>
